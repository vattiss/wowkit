name: Bug report
description: Something glows when it should not, does not glow, or shows an error.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Glowing Bars version
      description: It's at the top of the What's New tab in /gb settings.
      value: latest
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: From the bottom left of the login screen, if you know it.
      placeholder: 1.60.1
  - type: textarea
    id: scan
    attributes:
      label: Scan report
      description: In /gb settings, open the Welcome tab, click Scan, then Select, and press Ctrl+C. Paste it here.
      render: text
  - type: input
    id: character
    attributes:
      label: Class, level and talent tree
      description: "For example: Shaman, level 30, Elemental."
      value: unknown
  - type: input
    id: spell
    attributes:
      label: Spell or item
      description: The name, and its ID if you know it (turn on "Show spell and item IDs in tooltips" on the General tab of /gb settings).
      placeholder: Blessing of Kings, 20217
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      placeholder: Blessing of Kings keeps glowing, although it is on me.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be repeated?
      description: Were you in combat, in a party or a raid, in a town?
      placeholder: |
        1. Join a party
        2. Cast the blessing on a party member
        3. The button keeps glowing
  - type: input
    id: bars
    attributes:
      label: Action bars
      description: Blizzard's bars, gamepad bars, or a UI addon, with its version.
      placeholder: Blizzard's bars
  - type: textarea
    id: lua-error
    attributes:
      label: Lua error
      description: If there is an error, paste it here. To see errors in the game, type `/console scriptErrors 1`.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A picture of the action bar or the `/gb` table helps a lot. You can drag it here.
