# Checks every push to main, every pull request, and any branch by hand: types, the rule checks, lint, build and the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: to check development before a release
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LUA: lua
    steps:
      - uses: actions/checkout@v4

      # The pnpm version is the "packageManager" field of package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The tests are Lua, run by LuaJIT against the built addon
      # From GitHub, not from Ubuntu's package servers, whose outages stopped the 3.0.2 release. The lua command is LuaJIT
      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: luajit-2.1

      - name: Check LuaJIT
        run: lua -v

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      # Rule checks, lint, build, build the tests, run them
      - name: Test
        run: pnpm test
