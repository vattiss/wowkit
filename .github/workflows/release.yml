# Makes the zip of one addon when a tag like glowing-bars-v1.0.0 is pushed, and attaches it to a GitHub release, from
# where it is downloaded and uploaded to CurseForge by hand. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the changelog reads the commits since the addon's previous tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - run: pnpm install --frozen-lockfile

      # glowing-bars-v1.0.0 -> addon glowing-bars, version 1.0.0; the version must be the one in its package.json
      - name: Read the tag
        id: tag
        run: |
          addon="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          test -f "addons/$addon/package.json" || { echo "No addon folder addons/$addon"; exit 1; }
          packaged="$(jq -r .version "addons/$addon/package.json")"
          test "$packaged" = "$version" || { echo "Tag says $version, addons/$addon/package.json says $packaged"; exit 1; }
          echo "addon=$addon" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test

      - name: Build and zip the addon
        run: pnpm --filter "./addons/${{ steps.tag.outputs.addon }}" zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="addons/${{ steps.tag.outputs.addon }}/dist"
          gh release create "$GITHUB_REF_NAME" "$dist"/*.zip --title "$GITHUB_REF_NAME" --notes-file "$dist/changelog.md"
